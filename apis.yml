name: Bukalapak
description: >-
  Bukalapak is one of Indonesia's largest online marketplaces and all-commerce
  platforms, connecting millions of individual sellers, small warungs (kiosks),
  and buyers across the archipelago, alongside virtual products, financial
  services, and online-to-offline retail. Originally added to the API Evangelist
  network as a portfolio-lead stub (backed by 500 Global), this profile has been
  enriched from Bukalapak's real public developer surface: a public REST API at
  api.bukalapak.com secured with OAuth2 via accounts.bukalapak.com, a first-party
  JavaScript SDK (bukalapak.js), and a large public GitHub organization. No
  OpenAPI/Swagger specification is currently published by the provider, so the
  captured artifacts (authentication, packages, domain security) are sourced from
  first-party repositories and live domain probes rather than derived from a spec.
